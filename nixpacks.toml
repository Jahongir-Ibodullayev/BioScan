[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["python -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[phases.build]
cmds = [". /opt/venv/bin/activate && python manage.py collectstatic --noinput"]

[start]
cmd = ". /opt/venv/bin/activate && python manage.py migrate --noinput && python -m gunicorn togai.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --log-file -"
