[project]
name = "bioscan-fastapi"
version = "1.0.0"
description = "BioScan AI nature/species identification — async FastAPI backend"
readme = "README.md"
requires-python = ">=3.10"  # fastapi==0.136.1 Requires-Python >=3.10
license = { text = "Proprietary" }
authors = [{ name = "Otabek Qayumov", email = "otabekqayumov762@gmail.com" }]

dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "gunicorn==23.0.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "bcrypt==4.2.1",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "orjson==3.12.0",
    "redis==5.3.1",
    "celery==5.6.3",
    "firebase-admin==7.4.0",
    "sentry-sdk[fastapi]==2.59.0",
    "python-decouple==3.8",
    "Pillow==11.0.0",
    "python-slugify==8.0.4",
    "reportlab==4.2.5",
    "python-telegram-bot==21.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-cov==6.0.0",
    "aiosqlite==0.22.1",
    "sqladmin==0.32.0",
    "pyflakes==3.4.0",
    "autoflake==2.3.1",
]

[project.urls]
Homepage = "https://bioscan.duckdns.org"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["venv", "alembic/versions", "__pycache__", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = [
    "E501",  # uzun qatorlar
    "E712",  # SQLAlchemy `== True/False`
    "B008",  # FastAPI idiomasi: Depends()/File()/Query() default argument sifatida
    "UP007", # Python 3.9: runtime `Annotated[X | None, ...]` 3.10'da ishlaydi — Optional[] saqlanadi
]

[tool.coverage.run]
source = ["app"]
omit = ["app/bot/*", "tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
