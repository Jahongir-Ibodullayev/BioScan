## BioScan FastAPI — nginx + brotli + HTTP/2 + gzip + proxy cache
# /etc/nginx/sites-available/bioscan'ga ulanadi
#
# brotli moduli kerak — sudo apt install libnginx-mod-http-brotli
# Yo'q bo'lsa ham gzip ishlaydi
#
# Proxy cache zonalari nginx.conf'da yoki shu yerda http {} bloki ichida bo'lishi mumkin:
#   proxy_cache_path /var/cache/nginx/bioscan levels=1:2 keys_zone=bioscan:50m
#                    max_size=2g inactive=24h use_temp_path=off;

upstream bioscan_backend {
    # Cutover paytida ikkala server ham qo'shilgan — Django backup
    # FastAPI ishlamasa, Django'ga fallback bo'ladi
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;       # FastAPI (primary)
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s backup; # Django (backup)
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name bioscan.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bioscan.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/bioscan.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bioscan.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP/2 push (eskirgan, lekin Vary header'larini optimallaymiz)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # GZIP
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/atom+xml
        application/rss+xml
        text/plain
        text/css
        text/javascript
        text/xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # BROTLI (libnginx-mod-http-brotli paket o'rnatilgan bo'lsa)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_static on;
    # brotli_types application/json application/javascript text/css text/plain image/svg+xml;

    client_max_body_size 20M;
    keepalive_timeout 75s;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Media (rasm, PDF)
    location /media/ {
        alias /home/kayumovvv/loyihalarim/togai-backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/ {
        alias /home/kayumovvv/loyihalarim/togai-backend/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Aktiv reklama, species, map, public observations — kuchli nginx cache
    location ~ ^/api/(species|map/markers|observations/public|shop/products|shop/categories|search/browse|ads/active)/?$ {
        proxy_pass http://bioscan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Local nginx cache (50ms → 0.5ms uchun)
        proxy_cache bioscan;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # API → FastAPI (Django'ga backup fallback)
    location / {
        proxy_pass http://bioscan_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
